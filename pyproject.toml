[project]
name = "openimage-studio"
version = "0.1.0"
description = "A completely local photo editing harness: select with SAM, edit with a native editor, prove protected pixels unchanged, revise."
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = "Apache-2.0"
dependencies = [
    "torch==2.10.0",
    "torchvision==0.25.0",
    "diffusers==0.42.1",
    "transformers==5.22.1",
    "accelerate>=1.4",
    "safetensors>=0.5",
    "huggingface-hub>=0.30",
    "pillow>=10.4",
    "pillow-heif>=1.8",
    "numpy>=2.0",
    "scipy>=1.14",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "gradio>=5.0",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
lis = "lis.cli:main"
studio = "lis.web:main"

[tool.uv]
# Klein needs CUDA 12.8 wheels; keep torch off the default index.
index = [{ name = "pytorch-cu128", url = "https://download.pytorch.org/whl/cu128", explicit = true }]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lis"]
